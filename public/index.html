<style>

.bn-item{display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;cursor:pointer;color:var(--muted);font-family:var(--font-head);font-size:9px;font-weight:700;padding:4px 8px;border-radius:10px;transition:all .2s;min-width:48px;text-transform:uppercase;}

.tabs{display:none;}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:18px;}

.main-btn{width:100%;padding:12px;border-radius:10px;border:none;cursor:pointer;background:linear-gradient(135deg,var(--gold),#E69500);color:#0A0C10;font-family:system-ui,sans-serif;font-weight:800;font-size:14px;transition:all 0.2s;}.main-btn:hover{filter:brightness(1.08);}
.tbl-wrap{background:var(--card);border-radius:13px;border:1px solid var(--border);overflow:hidden;}
table{width:100%;border-collapse:collapse;}th{text-align:left;padding:9px 12px;font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);border-bottom:1px solid rgba(255,255,255,0.06);}td{padding:9px 12px;font-size:12px;border-bottom:1px solid rgba(255,255,255,0.04);}

.sec-btn{flex:1;padding:11px;border-radius:9px;border:1px solid rgba(255,255,255,0.1);background:transparent;color:var(--text);font-family:system-ui,sans-serif;font-weight:600;font-size:12px;cursor:pointer;}

.empty{color:var(--muted);font-size:12px;padding:12px 0;}
.sep{height:1px;background:rgba(255,255,255,0.06);margin:16px 0;}
.spin-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:500;align-items:center;justify-content:center;}.spin-overlay.show{display:flex;}
.spin-box{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:24px;text-align:center;font-size:14px;color:var(--muted);}
@media(max-width:500px){nav{padding:10px 12px;}.wrap{padding:14px 10px;}.pay-ops{grid-template-columns:1fr;}}


.setup-box{background:#1E2232;border:1px solid rgba(244,168,0,0.3);border-radius:22px;padding:32px 26px;width:100%;max-width:420px;box-shadow:0 30px 60px rgba(0,0,0,0.5);}

#loadBar { animation: loadAnim 3s ease forwards; }
@keyframes loadAnim {
  0%  { width: 0%; }
  30% { width: 40%; }
  60% { width: 70%; }
  85% { width: 88%; }
  100%{ width: 92%; }
}


@keyframes glow{0%,100%{box-shadow:0 0 8px rgba(191,95,255,0.4),0 0 20px rgba(191,95,255,0.2);}50%{box-shadow:0 0 15px rgba(191,95,255,0.8),0 0 40px rgba(191,95,255,0.3);}}
@keyframes glow-green{0%,100%{box-shadow:0 0 8px rgba(0,255,179,0.4);}50%{box-shadow:0 0 20px rgba(0,255,179,0.8);}}
@keyframes fluo-border{0%,100%{border-color:rgba(191,95,255,0.2);}50%{border-color:rgba(191,95,255,0.7);}}

.vip-card,.pay-card{animation:fluo-border 4s ease-in-out infinite;}
.appr-btn{background:linear-gradient(135deg,#00FFB3,#00C896)!important;box-shadow:0 0 12px rgba(0,255,179,0.4);}
.rej-btn{box-shadow:0 0 8px rgba(255,45,120,0.4);}
</style>
