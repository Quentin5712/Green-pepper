<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Connexion — Green Pepper Market</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="/css/style.css" rel="stylesheet">
  <style>
    .auth-card{background:#fff;border-radius:20px;padding:40px;box-shadow:0 8px 40px rgba(0,0,0,.1);width:100%;max-width:440px}
    .auth-input{width:100%;padding:12px 14px;border:1.5px solid #e5e7eb;border-radius:10px;font-size:15px;color:#111;font-family:'Inter',sans-serif;outline:none}
    .auth-input:focus{border-color:#f97316}
    .auth-btn{width:100%;padding:13px;background:#f97316;color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;transition:background .15s}
    .auth-btn:hover{background:#ea6c00}
    .auth-btn:disabled{opacity:.5;cursor:not-allowed}
    .auth-error{color:#dc2626;font-size:13px;text-align:center;margin-top:10px;display:none}
  </style>
</head>
<body style="background:#f3f4f6;min-height:100vh;display:flex;flex-direction:column">
  <header style="background:#111827;padding:16px 24px">
    <a href="/" style="font-family:'Playfair Display',serif;font-size:20px;color:#fff;text-decoration:none">🌶️ Green Pepper</a>
  </header>
  <main style="flex:1;display:flex;align-items:center;justify-content:center;padding:32px 16px">
    <div class="auth-card">
      <h1 style="font-family:'Playfair Display',serif;font-size:26px;margin-bottom:6px;color:#111">Connexion</h1>
      <p style="font-size:13px;color:#6b7280;margin-bottom:28px">Accédez à votre compte Green Pepper</p>

      <div style="margin-bottom:16px">
        <label style="display:block;font-size:12px;font-weight:600;color:#374151;margin-bottom:6px">Adresse e-mail</label>
        <input id="email" type="email" required autocomplete="email" class="auth-input" placeholder="votre@email.com">
      </div>
      <div style="margin-bottom:24px">
        <label style="display:block;font-size:12px;font-weight:600;color:#374151;margin-bottom:6px">Mot de passe</label>
        <input id="password" type="password" required autocomplete="current-password" class="auth-input" placeholder="••••••••">
      </div>

      <button id="loginBtn" onclick="doLogin()" class="auth-btn">Se connecter</button>
      <p id="loginError" class="auth-error"></p>

      <div style="text-align:center;margin-top:20px">
        <p style="font-size:13px;color:#6b7280">Pas encore de compte ? <a href="/register.html" style="color:#f97316;font-weight:600">Créer un compte</a></p>
      </div>
    </div>
  </main>
  <script>
    async function doLogin() {
      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const btn      = document.getElementById('loginBtn');
      const err      = document.getElementById('loginError');
      err.style.display = 'none';

      if (!email || !password) { err.textContent = 'Email et mot de passe requis'; err.style.display = 'block'; return; }

      btn.disabled = true; btn.textContent = 'Connexion…';

      try {
        const r = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ email, password }),
        });
        const data = await r.json();

        if (!r.ok) { err.textContent = data.error || 'Identifiants incorrects'; err.style.display = 'block'; btn.disabled = false; btn.textContent = 'Se connecter'; return; }

        localStorage.setItem('gp_token', data.token);
        localStorage.setItem('gp_user', JSON.stringify(data.user));

        const role = data.user?.role;
        if (role === 'admin')    { window.location.href = '/admin.html'; }
        else if (role === 'merchant') { window.location.href = '/merchant.html'; }
        else { window.location.href = new URLSearchParams(window.location.search).get('redirect') || '/'; }

      } catch(e) { err.textContent = 'Erreur réseau. Réessayez.'; err.style.display = 'block'; btn.disabled = false; btn.textContent = 'Se connecter'; }
    }

    document.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

    // Déjà connecté
    const token = localStorage.getItem('gp_token');
    const user  = JSON.parse(localStorage.getItem('gp_user') || '{}');
    if (token && user.role) {
      if (user.role === 'admin')    window.location.href = '/admin.html';
      else if (user.role === 'merchant') window.location.href = '/merchant.html';
      else window.location.href = '/';
    }
  </script>
</body>
</html>
